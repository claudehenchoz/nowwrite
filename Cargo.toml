[package]
name = "nowwrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nowwrite"
path = "src/main.rs"
required-features = ["terminal"]

[[bin]]
name = "nowwrite_uefi"
path = "src/uefi_main.rs"
required-features = ["uefi"]

[dependencies]
# default-features = false keeps ratatui no_std (+ alloc) for the UEFI build.
ratatui = { version = "0.30", default-features = false }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
uefi = { version = "0.41", optional = true, features = ["alloc", "global_allocator", "panic_handler"] }

[features]
default = ["terminal"]
# Linux/Windows/macOS terminal build via ratatui's crossterm backend.
terminal = ["ratatui/crossterm", "dep:chrono"]
# Standalone UEFI application (build with --target x86_64-unknown-uefi).
uefi = ["dep:uefi"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[build-dependencies]
fontdue = "0.9.5"
